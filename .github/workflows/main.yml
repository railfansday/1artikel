name: Scrape & Export HTML (100 Artikel/Halaman)

on:
  workflow_dispatch:          # Tombol manual
  schedule:
    - cron: '0 */6 * * *'     # Opsional: Berjalan otomatis setiap 6 jam

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45        # Waktu dinaikkan agar aman untuk scraping

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== JALANKAN FILE GABUNGAN =====
      - name: Jalankan Scraper & Export
        run: python importexport.py

      # ===== COMMIT & PUSH HASIL =====
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ambil folder database dan SEMUA file HTML/XML yang dihasilkan di folder utama
          git add database_hasil5/ *.html *.xml *.txt || true
          
          # Jika tidak ada perubahan, hentikan dengan sukses
          git diff --staged --quiet && echo "Tidak ada artikel baru" && exit 0
          
          # Commit dan Push
          git commit -m "Update otomatis: Export HTML 100/Halaman [skip ci]"
          git pull --rebase origin main || true
          git push
